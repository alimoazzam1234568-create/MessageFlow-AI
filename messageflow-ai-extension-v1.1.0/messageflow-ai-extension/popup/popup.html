<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MessageFlow AI</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; margin: 0; }
      body { width: 340px; font-family: "Inter", system-ui, sans-serif; background: #070a10; color: #d6dce8; font-size: 13px; }
      .head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid rgba(148,163,184,.1); }
      .logo { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; background: linear-gradient(135deg,#6d5cff,#38bdf8); box-shadow: 0 6px 18px -6px rgba(99,102,241,.7); }
      h1 { font-size: 14px; font-weight: 700; color: #fff; }
      .sub { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: #64748b; }
      .stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; padding: 12px 16px 4px; }
      .stat { border: 1px solid rgba(148,163,184,.1); border-radius: 10px; background: rgba(255,255,255,.03); padding: 8px 10px; text-align: center; }
      .stat b { display: block; font-size: 18px; color: #fff; font-variant-numeric: tabular-nums; }
      .stat span { font-size: 9px; text-transform: uppercase; letter-spacing: .1em; color: #64748b; }
      .list { max-height: 200px; overflow-y: auto; padding: 8px 16px; }
      .row { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 10px; margin-bottom: 6px; border: 1px solid rgba(148,163,184,.08); background: rgba(255,255,255,.02); }
      .row .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; color: #e2e8f0; font-size: 12px; }
      .row .meta { font-size: 10px; color: #64748b; font-variant-numeric: tabular-nums; }
      .pill { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; padding: 2px 7px; border-radius: 999px; }
      .running { background: rgba(52,211,153,.12); color: #6ee7b7; }
      .scheduled { background: rgba(56,189,248,.12); color: #7dd3fc; }
      .paused, .draft { background: rgba(148,163,184,.12); color: #94a3b8; }
      .completed { background: rgba(34,211,238,.12); color: #67e8f9; }
      .failed { background: rgba(251,113,133,.12); color: #fda4af; }
      .empty { text-align: center; color: #64748b; font-size: 12px; padding: 22px 10px; }
      .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px 16px; }
      .actions .wide { grid-column: 1 / -1; }
      button { height: 34px; border-radius: 9px; border: 1px solid rgba(148,163,184,.15); background: rgba(255,255,255,.05); color: #e2e8f0; font-weight: 600; font-size: 12px; cursor: pointer; font-family: inherit; }
      button:hover { background: rgba(255,255,255,.09); }
      button.primary { background: linear-gradient(92deg,#6d5cff,#0ea5e9); border: none; color: #fff; }
      button.danger { border-color: rgba(251,113,133,.3); background: rgba(251,113,133,.1); color: #fda4af; }
      .note { padding: 0 16px 14px; font-size: 10.5px; line-height: 1.5; color: #64748b; }
      a { color: #818cf8; text-decoration: none; }
    </style>
  </head>
  <body>
    <div class="head">
      <span class="logo">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
          <path d="M3 6.5h9" stroke="#fff" stroke-width="2.4" stroke-linecap="round" />
          <path d="M7.5 12h13.5" stroke="#fff" stroke-width="2.4" stroke-linecap="round" opacity=".75" />
          <path d="M3 17.5h13" stroke="#fff" stroke-width="2.4" stroke-linecap="round" opacity=".5" />
        </svg>
      </span>
      <div>
        <h1>MessageFlow AI</h1>
        <p class="sub">Messaging Manager</p>
      </div>
    </div>

    <div class="stats">
      <div class="stat"><b id="statRunning">0</b><span>Running</span></div>
      <div class="stat"><b id="statScheduled">0</b><span>Scheduled</span></div>
      <div class="stat"><b id="statSent">0</b><span>Processed</span></div>
    </div>

    <div class="list" id="list"><p class="empty">Loading…</p></div>

    <div class="actions">
      <button id="scanChat" class="primary wide">Scan current chat &amp; compose</button>
      <button id="openDash" class="wide">Open full dashboard</button>
      <button id="connectDiscord">Connect Discord webhook</button>
      <button id="stop" class="danger">Stop all</button>
    </div>
    <p id="scanStatus" class="note">
      Open a Discord channel, Telegram Web chat, WhatsApp Web chat or Instagram DM, then click <b>Scan current chat &amp; compose</b>.
    </p>

    <script src="popup.js" type="module"></script>
  </body>
</html>
